study:
  profile: paper
  seed: 2026
mock:
  n_universe: 120000
  n_singletons: 200
  n_lensed_pairs: 40
  nsamp: 1000
  n_unlensed_inj: 200000
  n_lensed_inj: 300000
  conditioning: fixed_counts
candidate_graph:
  max_edges_per_event: 2
  max_total_edges: 400
  include_time_marks: true
  include_sky_marks: true
  include_mass_distance_score: true
  edge_mark_prior_keys:
  - log_sky_overlap
selection:
  pair_tag_model: snr_time_sky
  pair_tag_constant: 1.0
  pair_tag_perturb_logit: 0.0
inference:
  partition_mode: marginalize_exact
  sampler: dynesty
  nlive: 1000
  dlogz: 10.0
  pair_batch_size: 256
  y_nodes_pair: 64
  diagnostics_only: false
